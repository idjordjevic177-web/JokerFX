<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JokerFX Signals PRO</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            background: url('joker.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: -1;
        }

        /* LIVE TICKER NA VRHU */
        .top-ticker {
            width: 100%;
            height: 40px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #0ea5e9;
        }

        .header { text-align: center; padding: 20px; font-size: 32px; font-weight: 800; text-shadow: 0 0 20px #0ea5e9; }
        
        .fancy-ui {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(14, 165, 233, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        /* TABELA */
        .table-header, .row {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            text-align: center;
            padding: 15px;
            margin-bottom: 10px;
        }
        .table-header { background: rgba(14, 165, 233, 0.2); font-weight: bold; font-size: 12px; border-radius: 10px; }
        .row { border: 1px solid rgba(255, 255, 255, 0.05); }
        .buy { color: #4ade80; font-weight: bold; }
        .win { color: #4ade80; text-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }

        /* DESNI PANEL (SENTIMENT & NEWS) */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }

        /* SAT I KONTROLE (Kao ranije) */
        .controls-left { position: fixed; bottom: 30px; left: 20px; display: flex; flex-direction: column; gap: 10px; }
        .controls-left button { 
            width: 180px; padding: 12px; border: 1px solid #0ea5e9; 
            background: rgba(15, 23, 42, 0.8); color: white; cursor: pointer; font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="top-ticker">
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
        "symbols": [
            {"proName": "FOREXCOM:XAUUSD", "title": "GOLD"},
            {"proName": "BINANCE:BTCUSDT", "title": "BITCOIN"},
            {"proName": "FX_IDC:EURUSD", "title": "EURUSD"},
            {"proName": "INDEX:DXY", "title": "DXY"}
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "isTransparent": true,
        "displayMode": "adaptive",
        "locale": "en"
        }
        </script>
    </div>
</div>

<div class="header">JokerFX Signals</div>

<div class="main-layout">
    <div class="left-col">
        <div class="table-header">
            <div>Day</div><div>Type</div><div>Pair</div><div>Entry</div><div>SL</div><div>TP</div><div>RR</div><div>Status</div>
        </div>
        <div class="row fancy-ui">
            <div>Monday</div><div class="buy">BUY</div><div>XAUUSD</div><div>4610</div><div>4595</div><div>4700</div><div>1:6</div><div class="win">Profit</div>
        </div>
        <div class="fancy-ui" style="margin-top: 20px; height: 450px; overflow: hidden;">
            <div style="padding: 15px; font-weight: bold; border-bottom: 1px solid rgba(14, 165, 233, 0.3);">LIVE MARKET NEWS</div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                {
                "feedMode": "all_symbols",
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "regular",
                "width": "100%",
                "height": "400",
                "locale": "en"
                }
                </script>
            </div>
        </div>
    </div>

    <div class="side-panel">
        <div class="fancy-ui" style="padding: 15px; height: 400px;">
            <div style="text-align: center; font-weight: bold; margin-bottom: 10px;">XAUUSD SENTIMENT</div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                {
                "interval": "1h",
                "width": "100%",
                "isTransparent": true,
                "height": "330",
                "symbol": "FOREXCOM:XAUUSD",
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
                }
                </script>
            </div>
        </div>

        <div class="fancy-ui" style="padding: 20px; text-align: center;">
            <h4 style="margin:0 0 15px 0;">Weekly Stats</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><small>Win</small><h2 class="win">1</h2></div>
                <div><small>Pips</small><h2>+900</h2></div>
            </div>
        </div>
    </div>
</div>

<div class="controls-left">
    <button class="fancy-ui" onclick="window.location.href='index.html'">🏠 Back to Home</button>
</div>

</body>
</html>
