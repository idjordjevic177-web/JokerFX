<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JokerFX Signals</title>

<style>

body{
    margin:0;
    font-family:Arial;
    color:white;
    background:url('joker.jpg') no-repeat center center fixed;
    background-size:cover;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    z-index:-1;
}

/* HEADER */
.header{
    text-align:center;
    padding:20px;
    font-size:26px;
}

/* TABLE */
.container{padding:20px;}

.table-header,.row{
    display:grid;
    grid-template-columns:120px repeat(7,1fr);
    text-align:center;
    border-radius:12px;
    margin-bottom:10px;
}

.table-header{
    background:rgba(255,255,255,0.08);
    padding:12px;
}

.row{
    background:rgba(255,255,255,0.06);
    padding:14px;
    backdrop-filter:blur(6px);
}

.buy{color:#4ade80;}
.sell{color:#f87171;}
.win{color:#4ade80;}
.loss{color:#f87171;}

/* ✅ DODATO */
.entry{color:#facc15;}
.sl{color:#f87171;}
.tp{color:#4ade80;}

.active{
    color:#facc15;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

/* STATS */
.stats{
    width:80%;
    margin:30px auto;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:12px;
}

.stats-row{
    display:flex;
    justify-content:space-around;
}

/* CLOCK */
#clock{
    position:fixed;
    bottom:20px;
    right:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    padding:15px;
    border-radius:15px;
    text-align:center;
}

.clock-face{
    width:80px;
    height:80px;
    border:2px solid rgba(255,255,255,0.2);
    border-radius:50%;
    position:relative;
    margin:auto;
}

.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin:bottom;
    background:white;
}

.hour{width:3px;height:20px;}
.minute{width:2px;height:30px;}
.second{width:1px;height:35px;background:#22c55e;}

.dot{
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.digital{font-size:14px;}
.sessions{font-size:10px;opacity:0.7;}

/* BUTTON */
#openCalendar{
    position:fixed;
    bottom:20px;
    left:20px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
}

/* ✅ BACK HOME */
#backHome{
    position:fixed;
    bottom:70px;
    left:20px;
    padding:10px 16px;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    text-decoration:none;
    font-size:14px;
}

</style>
</head>

<body>

<div class="header">Weekly Signals Overview</div>

<div class="container">

<div class="table-header">
<div>Day</div><div>Type</div><div>Pair</div>
<div>Entry</div><div>SL</div><div>TP</div><div>RR</div><div>Status</div>
</div>

<div class="row">
<div>Monday</div>
<div class="buy">BUY</div>
<div>XAUUSD</div>

<div class="entry">4610</div>
<div class="sl">4595</div>
<div class="tp">4700</div>

<div>1:6</div>
<div class="win">Closed - Profit</div>
</div>

<!-- OSTATAK TVOG KODA OSTAO ISTI -->

</div>

<div class="stats">
<h3>Weekly Statistics</h3>
<p>06.04.2026 - 13.06.2026</p>

<div class="stats-row">
<div><p>Total</p><h2>1</h2></div>
<div><p>Win</p><h2 class="win">1</h2></div>
<div><p>Loss</p><h2 class="loss">0</h2></div>
<div><p>Pips</p><h2>+900</h2></div>
</div>
</div>

<!-- CLOCK -->
<div id="clock">
<div class="clock-face" id="face"></div>
<div class="digital" id="digital"></div>
<div class="sessions" id="sessions"></div>
</div>

<!-- ✅ BACK BUTTON -->
<a href="index.html" id="backHome">🏠 Home</a>

<button id="openCalendar">📊 Previous Month</button>

<!-- ostatak koda (modal + script) NE DIRAM -->

</body>
</html>
