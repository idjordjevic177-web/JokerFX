<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JokerFX</title>

<style>
body{
    margin:0;
    background:url('joker.jpg') no-repeat center center fixed;
    background-size:cover;
    color:white;
    font-family:Arial;
    cursor:none;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    z-index:-1;
}

/* HEADER */
.header{
    padding:20px;
    font-size:30px;
    position:relative;
}

/* GLITCH */
.glitch:hover::before,
.glitch:hover::after{
    content:attr(data-text);
    position:absolute;
    left:20px;
}

.glitch:hover::before{color:#22c55e;animation:glitch 0.2s infinite;}
.glitch:hover::after{color:#0ea5e9;animation:glitch 0.2s infinite reverse;}

@keyframes glitch{
    0%{transform:translate(2px,0)}
    50%{transform:translate(-2px,2px)}
    100%{transform:translate(2px,-2px)}
}

/* LIVE BADGE */
.live-badge{
    position:absolute;
    top:25px;
    right:20px;
    background:#ef4444;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}

/* LAYOUT */
.main{display:flex;}

.left-panel{
    width:180px;
    padding:20px;
}

.left-panel div{
    margin:10px 0;
    cursor:pointer;
}

/* CHART */
#chart-container{
    flex:1;
    margin:20px;
}

.buttons{
    text-align:center;
    margin-bottom:10px;
}

.buttons button{
    margin:5px;
    padding:8px 15px;
    background:#1f2937;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* RIGHT */
#price-panel{
    width:260px;
    margin:20px;
}

/* BUTTONS */
.bottom-buttons{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    background:#111827;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.1);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 0px rgba(34,197,94,0.2)}
    50%{box-shadow:0 0 20px rgba(34,197,94,0.7)}
    100%{box-shadow:0 0 0px rgba(34,197,94,0.2)}
}

/* CLOCK */
#clock-widget{
    position:fixed;
    bottom:20px;
    right:20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.clock{
    width:90px;
    height:90px;
    border:3px solid rgba(255,255,255,0.2);
    border-radius:50%;
    position:relative;
    margin:auto;
}

.dot{
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin: bottom;
    background:white;
}

.hour{width:3px;height:20px;}
.minute{width:2px;height:30px;}
.second{width:1px;height:35px;background:#22c55e;}

.digital{margin-top:10px;}
.sessions{font-size:12px;opacity:0.7;}

/* CURSOR */
.cursor{
    width:12px;
    height:12px;
    border:2px solid #0ea5e9;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
}

.cursor-trail{
    width:6px;
    height:6px;
    background:#0ea5e9;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
}

/* MOBILE */
@media(max-width:768px){
.main{flex-direction:column;}
.left-panel{display:none;}
#price-panel{width:100%;margin:10px;}
#chart{height:300px !important;}
}
</style>
</head>

<body>

<div class="header glitch" data-text="JokerFX">
JokerFX
<div class="live-badge">LIVE</div>
</div>

<div class="main">

<div class="left-panel">
<div onclick="window.open('https://instagram.com/ivan.djordjevic13')">📸 Instagram</div>
<div onclick="window.open('https://t.me/jokeerfX')">📲 Telegram</div>
</div>

<div id="chart-container">

<div class="buttons">
<button onclick="changeSymbol('FOREXCOM:XAUUSD')">GOLD</button>
<button onclick="changeSymbol('FOREXCOM:EURUSD')">EURUSD</button>
<button onclick="changeSymbol('BINANCE:BTCUSDT')">BTC</button>
</div>

<div id="chart"></div>

</div>

<div id="price-panel">

<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "width": "100%",
  "height": "260",
  "tabs": [{
    "title": "Main",
    "symbols": [
      {"s":"BINANCE:BTCUSDT"},
      {"s":"FOREXCOM:XAUUSD"},
      {"s":"CAPITALCOM:DXY"}
    ]
  }]
}
</script>

</div>

</div>

<!-- BUTTONS -->
<div class="bottom-buttons">
<div class="btn" onclick="window.location.href='ftmo.html'">🔥 FTMO Service</div>
<div class="btn" onclick="window.location.href='signals.html'">🔥 Signals & Analysis</div>
</div>

<!-- CLOCK -->
<div id="clock-widget">

<div class="clock">

<div class="dot" style="top:5%;left:50%;transform:translateX(-50%)"></div>
<div class="dot" style="top:20%;right:15%"></div>
<div class="dot" style="top:50%;right:5%"></div>
<div class="dot" style="bottom:20%;right:15%"></div>
<div class="dot" style="bottom:5%;left:50%;transform:translateX(-50%)"></div>
<div class="dot" style="bottom:20%;left:15%"></div>
<div class="dot" style="top:50%;left:5%"></div>
<div class="dot" style="top:20%;left:15%"></div>

<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>

</div>

<div class="digital" id="digital"></div>
<div class="sessions" id="sessions"></div>

</div>

<div class="cursor" id="cursor"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function createChart(symbol){
    document.getElementById("chart").innerHTML="";
    new TradingView.widget({
        "width":"100%",
        "height":500,
        "symbol":symbol,
        "interval":"60",
        "theme":"dark",
        "container_id":"chart"
    });
}
function changeSymbol(symbol){createChart(symbol);}
createChart("FOREXCOM:XAUUSD");

/* CLOCK */
function updateClock(){
    let now=new Date();

    let sec=now.getSeconds();
    let min=now.getMinutes();
    let hr=now.getHours();

    hour.style.transform=`rotate(${hr*30+min/2}deg)`;
    minute.style.transform=`rotate(${min*6}deg)`;
    second.style.transform=`rotate(${sec*6}deg)`;

    let ny=new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York"});
    let london=new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
    let tokyo=new Date().toLocaleTimeString("en-US",{timeZone:"Asia/Tokyo"});

    digital.innerHTML=london;
    sessions.innerHTML=`NY: ${ny}<br>London: ${london}<br>Tokyo: ${tokyo}`;
}
setInterval(updateClock,1000);
updateClock();

/* CURSOR */
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";

    let trail=document.createElement("div");
    trail.className="cursor-trail";
    trail.style.left=e.clientX+"px";
    trail.style.top=e.clientY+"px";
    document.body.appendChild(trail);

    setTimeout(()=>trail.remove(),300);
});
</script>

</body>
</html>
