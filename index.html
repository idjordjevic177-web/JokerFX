<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JokerFX</title>

<style>
body{
    margin:0;
    background:url('joker.jpg') no-repeat center center fixed;
    background-size:cover;
    color:white;
    font-family:Arial;
    cursor:default; /* FIX */
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    z-index:-1;
}

/* HEADER */
.header{
    padding:20px;
    font-size:30px;
    position:relative;
}

/* LIVE */
.live-badge{
    position:absolute;
    top:25px;
    right:20px;
    background:#ef4444;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}

/* LAYOUT */
.main{display:flex;}

.left-panel{
    width:180px;
    padding:20px;
}

.left-panel div{
    margin:10px 0;
    cursor:pointer;
}

/* CHART */
#chart-container{
    flex:1;
    margin:20px;
}

.buttons{
    text-align:center;
    margin-bottom:10px;
}

.buttons button{
    margin:5px;
    padding:8px 15px;
    background:#1f2937;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* RADIO */
#radio-bar{
    width:100%;
    margin-top:10px;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-radius:10px;
}

#radio-controls button{
    background:#111827;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}

/* RIGHT */
#price-panel{
    width:260px;
    margin:20px;
}

/* REMOVE TV SPACE */
.tradingview-widget-copyright{
    display:none !important;
}

/* BUTTONS */
.bottom-buttons{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    background:#111827;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.1);
}

/* CLOCK */
#clock-widget{
    position:fixed;
    bottom:20px;
    right:20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.clock{
    width:90px;
    height:90px;
    border:3px solid rgba(255,255,255,0.2);
    border-radius:50%;
    position:relative;
    margin:auto;
}

.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin: bottom;
    background:white;
}

.hour{width:3px;height:20px;}
.minute{width:2px;height:30px;}
.second{width:1px;height:35px;background:#22c55e;}

/* MOBILE */
@media(max-width:768px){
.main{flex-direction:column;}
.left-panel{display:none;}
#price-panel{width:100%;margin:10px;}
#chart{height:300px !important;}
}
</style>
</head>

<body>

<div class="header">
JokerFX
<div class="live-badge">LIVE</div>
</div>

<div class="main">

<div class="left-panel">
<div onclick="window.open('https://instagram.com/ivan.djordjevic13')">📸 Instagram</div>
<div onclick="window.open('https://t.me/jokeerfX')">📲 Telegram</div>
</div>

<div id="chart-container">

<div class="buttons">
<button onclick="changeSymbol('FOREXCOM:XAUUSD')">GOLD</button>
<button onclick="changeSymbol('FOREXCOM:EURUSD')">EURUSD</button>
<button onclick="changeSymbol('BINANCE:BTCUSDT')">BTC</button>
</div>

<div id="chart"></div>

<!-- RADIO -->
<div id="radio-bar">
<div>
🎧 Afro House
<div id="now-playing">Live Stream</div>
</div>

<div id="radio-controls">
<button onclick="togglePlay()">▶ / ⏸</button>
<input type="range" min="0" max="1" step="0.01" value="0.2" onchange="setVolume(this.value)">
</div>

<audio id="radio">
<source src="https://stream.zeno.fm/0r0xa792kwzuv" type="audio/mpeg">
</audio>
</div>

</div>

<div id="price-panel">
<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "width": "100%",
  "height": "220",
  "tabs": [{
    "title": "Main",
    "symbols": [
      {"s":"BINANCE:BTCUSDT"},
      {"s":"FOREXCOM:XAUUSD"},
      {"s":"CAPITALCOM:DXY"}
    ]
  }]
}
</script>
</div>

</div>

<div class="bottom-buttons">
<div class="btn" onclick="window.location.href='ftmo.html'">🔥 FTMO Service</div>
<div class="btn" onclick="window.location.href='signals.html'">🔥 Signals & Analysis</div>
</div>

<div id="clock-widget">
<div class="clock">
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
</div>
<div id="digital"></div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function createChart(symbol){
    document.getElementById("chart").innerHTML="";
    new TradingView.widget({
        "width":"100%",
        "height":500,
        "symbol":symbol,
        "interval":"60",
        "theme":"dark",
        "container_id":"chart"
    });
}
function changeSymbol(symbol){createChart(symbol);}
createChart("FOREXCOM:XAUUSD");

/* CLOCK FIX */
function updateClock(){
    let now=new Date();

    let sec=now.getSeconds();
    let min=now.getMinutes();
    let hr=now.getHours();

    let secDeg=sec*6;
    let minDeg=min*6+sec*0.1;
    let hrDeg=(hr%12)*30+min*0.5;

    second.style.transform=`rotate(${secDeg}deg)`;
    minute.style.transform=`rotate(${minDeg}deg)`;
    hour.style.transform=`rotate(${hrDeg}deg)`;

    digital.innerHTML=now.toLocaleTimeString();
}
setInterval(updateClock,1000);

/* RADIO FIX */
const radio=document.getElementById("radio");

function togglePlay(){
    radio.muted=false;
    radio.play().catch(()=>alert("Klikni opet"));
}

function setVolume(val){
    radio.volume=val;
}
</script>

</body>
</html>
