<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JokerFX</title>

<style>
body{
    margin:0;
    background:url('joker.jpg') no-repeat center center fixed;
    background-size:cover;
    color:white;
    font-family:Arial;
    cursor:none;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    z-index:-1;
}

/* HEADER */
.header{
    padding:20px;
    font-size:30px;
    position:relative;
}

/* GLITCH */
.glitch:hover::before,
.glitch:hover::after{
    content:attr(data-text);
    position:absolute;
    left:20px;
}

.glitch:hover::before{color:#22c55e;animation:glitch 0.2s infinite;}
.glitch:hover::after{color:#0ea5e9;animation:glitch 0.2s infinite reverse;}

@keyframes glitch{
    0%{transform:translate(2px,0)}
    50%{transform:translate(-2px,2px)}
    100%{transform:translate(2px,-2px)}
}

/* LIVE BADGE */
.live-badge{
    position:absolute;
    top:25px;
    right:20px;
    background:#ef4444;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}

/* LAYOUT */
.main{display:flex;}

.left-panel{
    width:180px;
    padding:20px;
}

#chart-container{
    flex:1;
    margin:20px;
}

.buttons{
    text-align:center;
    margin-bottom:10px;
}

.buttons button{
    margin:5px;
    padding:8px 15px;
    background:#1f2937;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* RIGHT */
#price-panel{
    width:260px;
    margin:20px;
}

/* BUTTONS */
.bottom-buttons{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    background:#111827;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.1);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 0px rgba(34,197,94,0.2)}
    50%{box-shadow:0 0 20px rgba(34,197,94,0.7)}
    100%{box-shadow:0 0 0px rgba(34,197,94,0.2)}
}

/* PROFIT COUNTER */
.profit{
    text-align:center;
    font-size:22px;
    margin-top:10px;
    color:#22c55e;
}

/* POPUP */
.popup{
    position:fixed;
    bottom:100px;
    right:20px;
    background:#111827;
    padding:12px;
    border-radius:10px;
    display:none;
}

/* CURSOR */
.cursor{
    width:12px;
    height:12px;
    border:2px solid #0ea5e9;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
}

.cursor-trail{
    width:6px;
    height:6px;
    background:#0ea5e9;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
}

/* MOBILE */
@media(max-width:768px){
.main{flex-direction:column;}
.left-panel{display:none;}
#price-panel{width:100%;margin:10px;}
#chart{height:300px !important;}
}
</style>
</head>

<body>

<div class="header glitch" data-text="JokerFX">
JokerFX
<div class="live-badge">LIVE</div>
</div>

<div class="profit" id="profit">+0%</div>

<div class="main">

<div class="left-panel">
<div>📸 Instagram</div>
<div>📲 Telegram</div>
</div>

<div id="chart-container">

<div class="buttons">
<button onclick="changeSymbol('FOREXCOM:XAUUSD')">GOLD</button>
<button onclick="changeSymbol('FOREXCOM:EURUSD')">EURUSD</button>
<button onclick="changeSymbol('BINANCE:BTCUSDT')">BTC</button>
</div>

<div id="chart"></div>

</div>

<div id="price-panel">

<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "width": "100%",
  "height": "260",
  "tabs": [{
    "title": "Main",
    "symbols": [
      {"s":"BINANCE:BTCUSDT"},
      {"s":"FOREXCOM:XAUUSD"},
      {"s":"CAPITALCOM:DXY"}
    ]
  }]
}
</script>

</div>

</div>

<!-- BUTTONS -->
<div class="bottom-buttons">
<div class="btn" onclick="window.location.href='ftmo.html'">🔥 FTMO Service</div>
<div class="btn" onclick="window.location.href='signals.html'">🔥 Signals & Analysis</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup"></div>

<div class="cursor" id="cursor"></div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function createChart(symbol){
    document.getElementById("chart").innerHTML="";
    new TradingView.widget({
        "width":"100%",
        "height":500,
        "symbol":symbol,
        "interval":"60",
        "theme":"dark",
        "container_id":"chart"
    });
}
function changeSymbol(symbol){createChart(symbol);}
createChart("FOREXCOM:XAUUSD");

/* PROFIT COUNTER */
let profit=0;
setInterval(()=>{
    profit+=Math.floor(Math.random()*5);
    document.getElementById("profit").innerText="+"+profit+"%";
},2000);

/* POPUP */
const names=["John","Mike","Alex","David"];
setInterval(()=>{
    let popup=document.getElementById("popup");
    let name=names[Math.floor(Math.random()*names.length)];
    popup.innerText=name+" just bought 100K FTMO";
    popup.style.display="block";
    setTimeout(()=>popup.style.display="none",3000);
},6000);

/* CURSOR */
const cursor=document.getElementById("cursor");

document.addEventListener("mousemove",(e)=>{
    cursor.style.left=e.clientX+"px";
    cursor.style.top=e.clientY+"px";

    let trail=document.createElement("div");
    trail.className="cursor-trail";
    trail.style.left=e.clientX+"px";
    trail.style.top=e.clientY+"px";
    document.body.appendChild(trail);

    setTimeout(()=>trail.remove(),300);
});
</script>

</body>
</html>
