<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gig4FX</title>

<style>
body {
    background: #0b0f1a;
    color: white;
    font-family: Arial;
}

/* PANEL DESNO */
#price-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 260px;
    background: #111827;
    border-radius: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<h1>Gig4FX</h1>

<div id="price-panel">

<!-- TradingView Widget -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>

  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
    "colorTheme": "dark",
    "dateRange": "1D",
    "showChart": false,
    "locale": "en",
    "largeChartUrl": "",
    "isTransparent": true,
    "showSymbolLogo": true,
    "width": "100%",
    "height": "400",
    "tabs": [
      {
        "title": "Main",
        "symbols": [
          {"s": "BINANCE:BTCUSDT", "d": "BTC"},
          {"s": "OANDA:XAUUSD", "d": "Gold"},
          {"s": "TVC:DXY", "d": "DXY"}
        ]
      },
      {
        "title": "Forex",
        "symbols": [
          {"s": "FX:EURUSD"},
          {"s": "FX:GBPUSD"},
          {"s": "FX:USDJPY"},
          {"s": "FX:AUDUSD"},
          {"s": "FX:USDCAD"}
        ]
      }
    ]
  }
  </script>
</div>

</div>

</body>
</html>
