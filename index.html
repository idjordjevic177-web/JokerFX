<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JokerFX</title>

<style>
body {
    margin: 0;
    background: url('joker.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    font-family: Arial, sans-serif;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    z-index: -1;
}

/* HEADER */
.header {
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 15px #0ea5e9;
}

/* CONTACT PANEL */
.left-panel {
    width: 200px;
    padding: 25px;
}

.contact-title {
    font-size: 16px;
    margin-bottom: 15px;
    opacity: 0.7;
}

.contact-item {
    margin: 15px 0;
    font-size: 15px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.contact-item:hover {
    background: rgba(14, 165, 233, 0.2);
}

/* LAYOUT */
.main { display: flex; }

/* CHART */
#chart-container {
    flex: 1;
    margin: 20px;
}

/* 🔥 BUTTONS UPGRADE */
.buttons {
    text-align: center;
    margin-bottom: 15px;
}

.buttons button {
    margin: 5px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(145deg, #1f2937, #111827);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.buttons button:hover {
    box-shadow: 0 0 10px #0ea5e9;
    transform: translateY(-2px);
}

/* RIGHT PANEL (WIDGET) */
#price-panel {
    width: 300px; /* Malo prosireno radi preglednosti tabova */
    margin: 20px;
}

.tradingview-widget-copyright {
    display: none !important;
}

/* BOTTOM BUTTONS */
.bottom-buttons {
    position: fixed;
    bottom: 100px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.btn {
    background: #111827;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
}

.btn:hover {
    background: #1f2937;
}

.btn.disabled {
    cursor: default;
    opacity: 0.5;
}

/* CLOCK */
#clock-widget {
    position: fixed;
    bottom: 100px;
    right: 20px;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
}

.clock {
    width: 100px;
    height: 100px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    position: relative;
    margin: auto;
}

.dot {
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
    position: absolute;
}

.hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom;
    background: white;
}

.hour { width: 3px; height: 25px; }
.minute { width: 2px; height: 35px; }
.second { width: 1px; height: 40px; background: #22c55e; }

.digital { margin-top: 10px; }
.sessions { font-size: 12px; opacity: 0.7; }

/* RADIO */
#radio-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.8);
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* MOBILE */
@media(max-width: 1024px){
    .main { flex-direction: column; }
    .left-panel { display: flex; width: 100%; justify-content: center; gap: 20px; padding: 10px 0; }
    #price-panel { width: 95%; margin: 10px auto; }
}
</style>
</head>

<body>

<div class="header">JokerFX</div>

<div class="main">

    <div class="left-panel">
        <div class="contact-title">Contact</div>
        <div class="contact-item" onclick="window.open('https://instagram.com/ivan.djordjevic13')">
            📸 Instagram
        </div>
        <div class="contact-item" onclick="window.open('https://t.me/jokeerfX')">
            📲 Telegram
        </div>
    </div>

    <div id="chart-container">
        <div class="buttons">
            <button onclick="changeSymbol('FOREXCOM:XAUUSD')">XAUUSD</button>
            <button onclick="changeSymbol('FOREXCOM:EURUSD')">EURUSD</button>
            <button onclick="changeSymbol('BINANCE:BTCUSDT')">BTC</button>
        </div>
        <div id="chart"></div>
    </div>

    <div id="price-panel">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
            {
              "colorTheme": "dark",
              "dateRange": "12M",
              "showChart": false,
              "locale": "en",
              "width": "100%",
              "height": "400",
              "largeChartUrl": "",
              "isTransparent": true,
              "showSymbolLogo": true,
              "showFloatingTooltip": false,
              "tabs": [
                {
                  "title": "Main",
                  "symbols": [
                    { "s": "FOREXCOM:XAUUSD", "d": "Gold" },
                    { "s": "BINANCE:BTCUSDT", "d": "Bitcoin" },
                    { "s": "FOREXCOM:DXY", "d": "US Dollar Index" },
                    { "s": "FOREXCOM:SPX500", "d": "S&P 500" }
                  ]
                },
                {
                  "title": "Forex",
                  "symbols": [
                    { "s": "FOREXCOM:EURUSD", "d": "EUR/USD" },
                    { "s": "FOREXCOM:GBPUSD", "d": "GBP/USD" },
                    { "s": "FOREXCOM:USDJPY", "d": "USD/JPY" },
                    { "s": "FOREXCOM:USDCHF", "d": "USD/CHF" },
                    { "s": "FOREXCOM:AUDUSD", "d": "AUD/USD" },
                    { "s": "FOREXCOM:USDCAD", "d": "USD/CAD" },
                    { "s": "FOREXCOM:NZDUSD", "d": "NZD/USD" }
                  ]
                }
              ]
            }
            </script>
        </div>
    </div>

</div>

<div class="bottom-buttons">
    <div class="btn disabled">🔥 FTMO Service <span style="font-size: 11px; opacity: 0.7; display: block;">(Coming soon)</span></div>
    <div class="btn" onclick="window.location.href='signals.html'">🔥 Signals & Analysis</div>
</div>

<div id="clock-widget">
    <div class="clock">
        <div class="dot" style="top:5%;left:50%"></div>
        <div class="dot" style="top:20%;right:15%"></div>
        <div class="dot" style="top:50%;right:5%"></div>
        <div class="dot" style="bottom:20%;right:15%"></div>
        <div class="dot" style="bottom:5%;left:50%"></div>
        <div class="dot" style="bottom:20%;left:15%"></div>
        <div class="dot" style="top:50%;left:5%"></div>
        <div class="dot" style="top:20%;left:15%"></div>
        
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
    </div>
    <div class="digital" id="digital"></div>
    <div class="sessions" id="sessions"></div>
</div>

<div id="radio-bar">
    <div style="font-size: 14px; margin-left: 10px;">🎧 Afro House Radio</div>
    <div>
        <button style="background: #111827; color: white; border: 1px solid #374151; padding: 5px 10px; border-radius: 5px; cursor: pointer;" onclick="togglePlay()">Play / Pause</button>
        <input type="range" min="0" max="1" step="0.01" value="0.2" onchange="setVolume(this.value)" style="vertical-align: middle; margin-left: 10px;">
    </div>
    
    <audio id="radio">
        <source src="https://stream.zeno.fm/0r0xa792kwzuv" type="audio/mpeg">
    </audio>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function createChart(symbol){
    document.getElementById("chart").innerHTML = "";
    new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": symbol,
        "interval": "60",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": "chart"
    });
}

function changeSymbol(symbol){
    createChart(symbol);
}

createChart("FOREXCOM:XAUUSD");

/* CLOCK */
function updateClock(){
    let now = new Date();
    let sec = now.getSeconds();
    let min = now.getMinutes();
    let hr = now.getHours();

    document.getElementById("second").style.transform = `rotate(${sec * 6}deg)`;
    document.getElementById("minute").style.transform = `rotate(${min * 6 + sec * 0.1}deg)`;
    document.getElementById("hour").style.transform = `rotate(${(hr % 12) * 30 + min * 0.5}deg)`;

    let ny = new Date().toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: '2-digit', minute:'2-digit'});
    let london = new Date().toLocaleTimeString("en-GB", {timeZone: "Europe/London", hour: '2-digit', minute:'2-digit'});
    let tokyo = new Date().toLocaleTimeString("en-US", {timeZone: "Asia/Tokyo", hour: '2-digit', minute:'2-digit'});

    document.getElementById("digital").innerHTML = london;
    document.getElementById("sessions").innerHTML = `NY: ${ny} | LDN: ${london} | TKY: ${tokyo}`;
}

setInterval(updateClock, 1000);
updateClock();

/* RADIO */
const radio = document.getElementById("radio");
function togglePlay(){
    radio.muted = false;
    if (radio.paused) {
        radio.play();
    } else {
        radio.pause();
    }
}
function setVolume(val){
    radio.volume = val;
}
</script>

</body>
</html>
