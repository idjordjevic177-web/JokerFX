<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gig4FX</title>

<style>
body {
    margin:0;
    background: linear-gradient(135deg,#020617,#0b0f1a);
    color:white;
    font-family: Arial;
}

/* HEADER */
h1 {
    padding:20px;
}

/* CHART */
#chart-container {
    width: 80%;
    margin: auto;
    margin-top: 30px;
}

/* PANEL */
#price-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 300px;
    background: #111827;
    border-radius: 12px;
    padding: 10px;
}

/* CLOCK */
#clock-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
}

/* ANALOG */
.clock {
    width: 100px;
    height: 100px;
    border: 3px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    position: relative;
    margin: auto;
}

/* DOTS */
.dot {
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.hand {
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin: bottom;
    background:white;
}

.hour { width:3px; height:25px; }
.minute { width:2px; height:35px; }
.second { width:1px; height:40px; background:#22c55e; }

/* DIGITAL */
.digital {
    font-size:20px;
    margin-top:10px;
}

.sessions {
    font-size:12px;
    opacity:0.7;
    margin-top:5px;
}
</style>
</head>

<body>

<h1>Gig4FX</h1>

<!-- 🔥 CHART (OVO JE ISPOD H1) -->
<div id="chart-container">
<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>
  <script>
  new TradingView.widget({
    "width": "100%",
    "height": 500,
    "symbol": "FOREXCOM:XAUUSD",
    "interval": "60",
    "timezone": "Europe/Belgrade",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#0b0f1a",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "container_id": "tradingview_chart"
  });
  </script>
</div>
</div>

<!-- PRICE PANEL -->
<div id="price-panel">

<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": "260",
  "tabs": [
    {
      "title": "Main",
      "symbols": [
        {"s": "BINANCE:BTCUSDT", "d": "BTC"},
        {"s": "FOREXCOM:XAUUSD", "d": "Gold"},
        {"s": "CAPITALCOM:DXY", "d": "DXY"}
      ]
    },
    {
      "title": "Forex",
      "symbols": [
        {"s": "FOREXCOM:EURUSD"},
        {"s": "FOREXCOM:GBPUSD"},
        {"s": "FOREXCOM:USDJPY"},
        {"s": "FOREXCOM:AUDUSD"},
        {"s": "FOREXCOM:USDCAD"}
      ]
    }
  ]
}
</script>
</div>

</div>

<!-- CLOCK -->
<div id="clock-widget">

<div class="clock">

<div class="dot" style="top:5%; left:50%; transform:translateX(-50%)"></div>
<div class="dot" style="top:20%; right:15%"></div>
<div class="dot" style="top:50%; right:5%"></div>
<div class="dot" style="bottom:20%; right:15%"></div>
<div class="dot" style="bottom:5%; left:50%; transform:translateX(-50%)"></div>
<div class="dot" style="bottom:20%; left:15%"></div>
<div class="dot" style="top:50%; left:5%"></div>
<div class="dot" style="top:20%; left:15%"></div>

<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>

</div>

<div class="digital" id="digital"></div>
<div class="sessions" id="sessions"></div>

</div>

<script>

function updateClock(){
    let now = new Date();

    let sec = now.getSeconds();
    let min = now.getMinutes();
    let hr = now.getHours();

    document.getElementById("second").style.transform =
        `rotate(${sec*6}deg)`;

    document.getElementById("minute").style.transform =
        `rotate(${min*6}deg)`;

    document.getElementById("hour").style.transform =
        `rotate(${hr*30 + min/2}deg)`;

    let ny = new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York"});
    let london = new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
    let tokyo = new Date().toLocaleTimeString("en-US",{timeZone:"Asia/Tokyo"});

    document.getElementById("digital").innerHTML = london;

    document.getElementById("sessions").innerHTML =
        "NY: " + ny + "<br>London: " + london + "<br>Tokyo: " + tokyo;
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
