<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JokerFX</title>

<style>
body {
    margin:0;
    background: url('joker.jpg') no-repeat center center fixed;
    background-size: cover;
    color:white;
    font-family: Arial;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.75);
    z-index:-1;
}

/* HEADER */
.header{
    padding:20px;
    font-size:26px;
}

/* LAYOUT */
.main{
    display:flex;
}

/* LEFT PANEL */
.left-panel{
    width:180px;
    padding:20px;
}

/* CHART */
#chart-container{
    flex:1;
    margin:20px;
}

/* BUTTONS */
.buttons{
    text-align:center;
    margin-bottom:10px;
}

.buttons button{
    margin:5px;
    padding:8px 15px;
    background:#1f2937;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* RIGHT PANEL */
#price-panel{
    width:260px;
    margin:20px;
}

/* 🔥 FLOAT BUTTONS */
.bottom-buttons{
    position:fixed;
    bottom:20px;
    left:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.btn{
    background:#111827;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.1);
    font-weight:500;
    transition:0.2s;
}

.btn:hover{
    background:#1f2937;
}

/* CLOCK */
#clock-widget{
    position:fixed;
    bottom:20px;
    right:20px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    text-align:center;
}

/* ANALOG */
.clock{
    width:90px;
    height:90px;
    border:3px solid rgba(255,255,255,0.2);
    border-radius:50%;
    position:relative;
    margin:auto;
}

.dot{
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
    position:absolute;
}

.hand{
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin: bottom;
    background:white;
}

.hour{width:3px;height:20px;}
.minute{width:2px;height:30px;}
.second{width:1px;height:35px;background:#22c55e;}

.digital{margin-top:10px;}
.sessions{font-size:12px;opacity:0.7;}

/* 📱 MOBILE */
@media (max-width:768px){

.main{
    flex-direction:column;
}

.left-panel{
    display:none;
}

#chart-container{
    width:100%;
    margin:10px;
}

#price-panel{
    width:100%;
    margin:10px;
}

.buttons button{
    padding:6px 10px;
    font-size:12px;
}

#chart{
    height:300px !important;
}

#clock-widget{
    transform:scale(0.8);
    bottom:10px;
    right:10px;
}

.bottom-buttons{
    left:10px;
    bottom:10px;
}

}
</style>
</head>

<body>

<div class="header">JokerFX</div>

<div class="main">

<!-- LEFT -->
<div class="left-panel">
<div onclick="window.open('https://instagram.com/ivan.djordjevic13')" style="cursor:pointer;">
📸 Instagram
</div>
<div onclick="window.open('https://t.me/jokeerfX')" style="cursor:pointer;">
📲 Telegram
</div>
</div>

<!-- CENTER -->
<div id="chart-container">

<div class="buttons">
<button onclick="changeSymbol('FOREXCOM:XAUUSD')">GOLD</button>
<button onclick="changeSymbol('FOREXCOM:EURUSD')">EURUSD</button>
<button onclick="changeSymbol('BINANCE:BTCUSDT')">BTC</button>
</div>

<div id="chart"></div>

</div>

<!-- RIGHT -->
<div id="price-panel">

<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "width": "100%",
  "height": "260",
  "tabs": [
    {
      "title": "Main",
      "symbols": [
        {"s": "BINANCE:BTCUSDT"},
        {"s": "FOREXCOM:XAUUSD"},
        {"s": "CAPITALCOM:DXY"}
      ]
    },
    {
      "title": "Forex",
      "symbols": [
        {"s": "FOREXCOM:EURUSD"},
        {"s": "FOREXCOM:GBPUSD"},
        {"s": "FOREXCOM:USDJPY"}
      ]
    }
  ]
}
</script>
</div>

</div>

</div>

<!-- 🔥 BUTTONS -->
<div class="bottom-buttons">

<div class="btn" onclick="window.location.href='ftmo.html'">
🔥 FTMO Service
</div>

<div class="btn" onclick="window.location.href='signals.html'">
🔥 Signals & Analysis
</div>

</div>

<!-- CLOCK -->
<div id="clock-widget">

<div class="clock">

<div class="dot" style="top:5%;left:50%;transform:translateX(-50%)"></div>
<div class="dot" style="top:20%;right:15%"></div>
<div class="dot" style="top:50%;right:5%"></div>
<div class="dot" style="bottom:20%;right:15%"></div>
<div class="dot" style="bottom:5%;left:50%;transform:translateX(-50%)"></div>
<div class="dot" style="bottom:20%;left:15%"></div>
<div class="dot" style="top:50%;left:5%"></div>
<div class="dot" style="top:20%;left:15%"></div>

<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>

</div>

<div class="digital" id="digital"></div>
<div class="sessions" id="sessions"></div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function createChart(symbol){
    document.getElementById("chart").innerHTML="";
    new TradingView.widget({
        "width":"100%",
        "height":500,
        "symbol":symbol,
        "interval":"60",
        "theme":"dark",
        "container_id":"chart"
    });
}

function changeSymbol(symbol){
    createChart(symbol);
}

createChart("FOREXCOM:XAUUSD");

/* CLOCK */
function updateClock(){
    let now=new Date();

    let sec=now.getSeconds();
    let min=now.getMinutes();
    let hr=now.getHours();

    hour.style.transform=`rotate(${hr*30+min/2}deg)`;
    minute.style.transform=`rotate(${min*6}deg)`;
    second.style.transform=`rotate(${sec*6}deg)`;

    let ny=new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York"});
    let london=new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
    let tokyo=new Date().toLocaleTimeString("en-US",{timeZone:"Asia/Tokyo"});

    digital.innerHTML=london;
    sessions.innerHTML=`NY: ${ny}<br>London: ${london}<br>Tokyo: ${tokyo}`;
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
