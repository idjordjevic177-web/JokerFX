<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gig4FX</title>

<style>
body {
    background: #0b0f1a;
    color: white;
    font-family: Arial;
}

/* PANEL DESNO */
#price-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 200px;
    background: #111827;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

.price-item {
    display: flex;
    justify-content: space-between;
    margin: 5px 0;
}

button {
    width: 100%;
    margin-top: 10px;
    background: #2563eb;
    border: none;
    padding: 8px;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

#more {
    display: none;
}
</style>
</head>

<body>

<h1>Gig4FX</h1>

<div id="price-panel">
    <div id="main-prices"></div>

    <button onclick="toggleMore()">Open More</button>

    <div id="more"></div>
</div>

<script>

const mainSymbols = ["BTC/USD", "XAU/USD", "DXY"];
const moreSymbols = ["EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD"];

let expanded = false;

function toggleMore(){
    expanded = !expanded;
    document.getElementById("more").style.display = expanded ? "block" : "none";
}

const API_KEY = "30653f857f3e4719b0edc51afad3c225";

async function getPrice(symbol){
    try{
        let res = await fetch(`https://api.twelvedata.com/price?symbol=${symbol}&apikey=${API_KEY}`);
        let data = await res.json();
        return data.price;
    } catch(e){
        return "err";
    }
}

async function updatePrices(){
    let mainHTML = "";
    for(let s of mainSymbols){
        let price = await getPrice(s);
        mainHTML += `<div class="price-item"><span>${s}</span><span>${price}</span></div>`;
    }
    document.getElementById("main-prices").innerHTML = mainHTML;

    let moreHTML = "";
    for(let s of moreSymbols){
        let price = await getPrice(s);
        moreHTML += `<div class="price-item"><span>${s}</span><span>${price}</span></div>`;
    }
    document.getElementById("more").innerHTML = moreHTML;
}

// refresh svake 2 sekunde
setInterval(updatePrices, 2000);

updatePrices();

</script>

</body>
</html>
