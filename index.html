<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gig4FX</title>

<style>
body {
    margin:0;
    background: linear-gradient(135deg,#020617,#0b0f1a);
    color:white;
    font-family: Arial;
}

/* PANEL */
#price-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 280px;
    background: #111827;
    border-radius: 12px;
    padding: 10px;
}

/* CLOCK GLASS */
#clock-widget {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 25px 40px;
    display: flex;
    align-items: center;
    gap: 30px;
}

/* ANALOG CLOCK */
.clock {
    width: 120px;
    height: 120px;
    border: 4px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    position: relative;
}

.hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom;
    background: white;
}

.hour { width:4px; height:30px; }
.minute { width:3px; height:45px; }
.second { width:2px; height:50px; background:#22c55e; }

/* DIGITAL */
.digital {
    font-size: 36px;
    font-weight: 300;
}

.sessions {
    font-size: 13px;
    opacity: 0.7;
}
</style>
</head>

<body>

<h1 style="padding:20px;">Gig4FX</h1>

<!-- PRICE PANEL -->
<div id="price-panel">

<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
{
  "colorTheme": "dark",
  "showChart": false,
  "locale": "en",
  "width": "100%",
  "height": "260",
  "tabs": [
    {
      "title": "Main",
      "symbols": [
        {"s": "BINANCE:BTCUSDT", "d": "BTC"},
        {"s": "FOREXCOM:XAUUSD", "d": "Gold"}
      ]
    },
    {
      "title": "Forex",
      "symbols": [
        {"s": "FOREXCOM:EURUSD"},
        {"s": "FOREXCOM:GBPUSD"},
        {"s": "FOREXCOM:USDJPY"},
        {"s": "FOREXCOM:AUDUSD"},
        {"s": "FOREXCOM:USDCAD"}
      ]
    }
  ]
}
</script>
</div>

</div>

<!-- CLOCK -->
<div id="clock-widget">

<div class="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
</div>

<div>
    <div class="digital" id="digital"></div>
    <div class="sessions" id="sessions"></div>
</div>

</div>

<script>

function updateClock(){
    let now = new Date();

    let sec = now.getSeconds();
    let min = now.getMinutes();
    let hr = now.getHours();

    document.getElementById("second").style.transform =
        `rotate(${sec*6}deg)`;

    document.getElementById("minute").style.transform =
        `rotate(${min*6}deg)`;

    document.getElementById("hour").style.transform =
        `rotate(${hr*30 + min/2}deg)`;

    let ny = new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York"});
    let london = new Date().toLocaleTimeString("en-GB",{timeZone:"Europe/London"});
    let tokyo = new Date().toLocaleTimeString("en-US",{timeZone:"Asia/Tokyo"});

    document.getElementById("digital").innerHTML = ny;

    document.getElementById("sessions").innerHTML =
        "NY: " + ny + " | London: " + london + " | Tokyo: " + tokyo;
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
